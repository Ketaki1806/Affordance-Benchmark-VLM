project_name: affordance_benchmark

data:
  # Full PACO-LVIS val (one preferred part per image). For the N=20 pilot use:
  #   sample_dir: data/paco/images
  #   manifest_path: data/paco/manifest_pilot.json
  # Point sample_dir at the COCO root (train2017/val2017) or a copy/symlink dir.
  # Resource-limited seminar run: N=100 subsample of val (see docs/project_notes.md).
  # Full preferred-part pool is ~1129; rebuild without --n for that.
  sample_dir: data/paco/coco
  manifest_path: data/paco/manifest_val_100.json

output:
  raw_captions: artifacts/captions/val_full/raw.json
  filtered_captions: artifacts/captions/val_full/filtered.json
  eval_clip: artifacts/eval/val_full/clip_ft.json
  eval_siglip: artifacts/eval/val_full/siglip.json
  eval_vljepa: artifacts/eval/val_full/open_vljepa.json
  eval_yspace: artifacts/eval/val_full/yspace_caption_analysis.json
  eval_summary: artifacts/eval/val_full/summary.json

models:
  qwen_vl: Qwen/Qwen2.5-VL-7B-Instruct
  clip: openai/clip-vit-large-patch14
  clip_device: cuda
  # Fine-tuned CLIP (same train_500 ranking FT as VL-JEPA).
  clip_checkpoint: artifacts/checkpoints/clip/finetuned_affordance_ep5.pt
  siglip: google/siglip-so400m-patch14-384
  siglip_device: cuda
  y_encoder: google/embeddinggemma-300m
  y_encoder_device: cuda
  qwen_dtype: float16
  min_pixels: 200704
  max_pixels: 1003520

  open_vljepa:
    enabled: true
    repo_root: vendor/open-vljepa
    checkpoint: artifacts/checkpoints/open-vljepa/finetuned_affordance_ep5.pt
    device: cuda
    # EmbeddingGemma does not support float16 (NaN embeddings). Use bf16 or fp32.
    dtype: bfloat16
    retrieval_prompt: "Describe the image."

captions:
  min_chars: 25
  max_chars: 55
  target_chars: 38
  min_words: 5
  max_words: 10
  max_length_delta: 10
  num_most_probable: 1
  num_negative: 1
  max_json_retries: 3
  max_generation_retries: 3

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9

eval:
  backends:
    - clip
