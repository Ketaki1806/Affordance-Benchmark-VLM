# Human pilot FT eval (N=20). See scripts/condor_submit_evaluate_human.sh

project_name: affordance_benchmark_eval_human

data:
  sample_dir: data/paco/images
  manifest_path: data/paco/manifest_pilot.json

output:
  raw_captions: humaneval/26jul/filtered.json
  filtered_captions: humaneval/26jul/human_filtered.json
  eval_clip: artifacts/eval/pilot_human/clip_ft.json
  eval_siglip: artifacts/eval/pilot_human/siglip.json
  eval_vljepa: artifacts/eval/pilot_human/open_vljepa_ft.json
  eval_yspace: artifacts/eval/pilot_human/yspace.json
  eval_summary: artifacts/eval/pilot_human/summary_ft.json

models:
  qwen_vl: Qwen/Qwen2.5-VL-7B-Instruct
  clip: openai/clip-vit-large-patch14
  clip_device: cuda
  clip_checkpoint: artifacts/checkpoints/clip/finetuned_affordance_ep5.pt
  siglip: google/siglip-so400m-patch14-384
  siglip_device: cuda
  y_encoder: google/embeddinggemma-300m
  y_encoder_device: cuda
  qwen_dtype: float16
  min_pixels: 200704
  max_pixels: 1003520

  open_vljepa:
    enabled: true
    repo_root: vendor/open-vljepa
    checkpoint: artifacts/checkpoints/open-vljepa/finetuned_affordance_ep5.pt
    device: cuda
    dtype: bfloat16
    retrieval_prompt: "Describe the image."

captions:
  min_chars: 25
  max_chars: 55
  target_chars: 38
  min_words: 5
  max_words: 10
  max_length_delta: 10
  num_most_probable: 1
  num_negative: 1
  max_json_retries: 3
  max_generation_retries: 3

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9

eval:
  backends:
    - clip
    - open_vljepa
